<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Brnno — Mobile Car Detailing</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>

<div id="screen-location" class="screen active">
  <div class="map-container">
    <div class="map-mock" id="map-bg">
      <div class="map-road-h" style="top:28%"></div>
      <div class="map-road-h" style="top:50%"></div>
      <div class="map-road-h" style="top:72%"></div>
      <div class="map-road-v" style="left:25%"></div>
      <div class="map-road-v" style="left:55%"></div>
      <div class="map-road-v" style="left:78%"></div>
      <div class="map-hwy"></div>
      <div class="map-block" style="top:15%;left:8%;width:60px;height:36px"></div>
      <div class="map-block" style="top:15%;left:32%;width:80px;height:30px"></div>
      <div class="map-block" style="top:58%;left:62%;width:50px;height:40px"></div>
      <div class="map-block" style="top:60%;left:10%;width:65px;height:28px"></div>
      <div class="pulse-ring" id="pulse-ring"></div>
      <div class="pulse-dot" id="pulse-dot"></div>
      <div class="location-label" id="loc-label">Detecting location...</div>
    </div>
    <div class="addr-bar" id="addr-bar">
      <div class="addr-dot"></div>
      <span id="addr-text">Locating you...</span>
      <button class="addr-change" onclick="showAddressSearch()">Change</button>
    </div>
  </div>
  <div class="location-bottom">
    <div id="address-search-wrap" style="display:none">
      <div class="search-wrap" style="position:relative">
        <svg class="search-icon-abs" width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#888" stroke-width="1.8"/><path d="M16.5 16.5L21 21" stroke="#888" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" id="addr-input" class="addr-input" placeholder="Search address..." autocomplete="off" oninput="handleAddrInput(this.value)"/>
        <div class="addr-dropdown" id="addr-dropdown"></div>
      </div>
      <div class="saved-places">
        <div class="saved-label">Saved places</div>
        <div class="saved-item" onclick="selectAddress('2847 NE 45th St, Seattle WA 98105','home')">
          <div class="saved-icon home-icon">&#8962;</div>
          <div><div class="saved-name">Home</div><div class="saved-addr">2847 NE 45th St, Seattle WA</div></div>
        </div>
        <div class="saved-item" onclick="selectAddress('1420 5th Ave, Seattle WA 98101','work')">
          <div class="saved-icon work-icon">&#8862;</div>
          <div><div class="saved-name">Work</div><div class="saved-addr">1420 5th Ave, Seattle WA</div></div>
        </div>
      </div>
    </div>
    <button class="btn-book" id="btn-book" onclick="startBooking()" disabled>Book a detail &rarr;</button>
  </div>
</div>

<div id="screen-booking" class="screen">
  <div class="booking-header">
    <button class="back-btn" onclick="bookingBack()">&larr; Back</button>
    <div class="pip-row" id="pip-row"></div>
    <span class="step-lbl" id="step-lbl"></span>
  </div>
  <div class="booking-content" id="booking-content"></div>
</div>

<div id="screen-dashboard" class="screen">
  <div class="dash-header">
    <div>
      <div class="dash-greeting" id="dash-greeting">Good morning</div>
      <div class="dash-title" id="dash-title">Track your detail</div>
    </div>
    <div class="user-avatar" id="user-avatar">?</div>
  </div>
  <div class="dash-content" id="dash-content"></div>
  <div class="tab-bar">
    <button class="tab active" id="tab-track" onclick="showDashTab('track')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Track</span>
    </button>
    <button class="tab" id="tab-progress" onclick="showDashTab('progress')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Progress</span>
    </button>
    <button class="tab" id="tab-chat" onclick="showDashTab('chat')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Chat</span>
    </button>
    <button class="tab" id="tab-garage" onclick="showDashTab('garage')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 22V12h6v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Garage</span>
    </button>
    <button class="tab" id="tab-referral" onclick="showDashTab('referral')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Refer</span>
    </button>
  </div>
</div>

<div id="screen-auth" class="screen">
  <div class="auth-wrap">
    <div class="auth-logo">Brnno</div>
    <div class="auth-tagline">Mobile detailing, booked in minutes</div>
    <div class="auth-card">
      <div id="auth-mode-tabs" class="auth-mode-tabs">
        <button class="auth-tab active" onclick="setAuthMode('login')">Log in</button>
        <button class="auth-tab" onclick="setAuthMode('signup')">Sign up</button>
      </div>
      <div id="auth-form">
        <input type="email" id="auth-email" class="auth-input" placeholder="Email address"/>
        <input type="password" id="auth-password" class="auth-input" placeholder="Password"/>
        <div id="auth-name-row" style="display:none">
          <input type="text" id="auth-first" class="auth-input" placeholder="First name"/>
          <input type="text" id="auth-last" class="auth-input" placeholder="Last name"/>
        </div>
        <button class="btn-auth" onclick="submitAuth()">Continue</button>
        <div class="auth-error" id="auth-error"></div>
        <div class="auth-divider">or</div>
        <button class="btn-auth-ghost" onclick="guestMode()">Continue as guest (demo)</button>
      </div>
    </div>
  </div>
</div>

<script src="./env.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
