<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Brnno — Mobile Car Detailing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0A0A0A;
  --ink2:#3D3D3D;
  --ink3:#717171;
  --line:#E8E8E8;
  --bg:#F7F7F5;
  --white:#FFFFFF;
  --brand:#2563EB;
  --brand-d:#1D4ED8;
  --brand-l:#EFF6FF;
  --brand-mid:#93C5FD;
  --green:#059669;
  --green-l:#ECFDF5;
  --amber:#D97706;
  --amber-l:#FFFBEB;
  --red:#DC2626;
  --r:16px;--rs:10px;--rxs:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.1),0 4px 10px rgba(0,0,0,.06);
  --f:'Inter',system-ui,sans-serif;
}
html,body{height:100%;font-family:var(--f);background:var(--bg);color:var(--ink);overflow:hidden;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* SCREENS */
.screen{display:none;position:fixed;inset:0;background:var(--white);flex-direction:column;overflow:hidden}
.screen.on{display:flex}

/* SCROLL AREAS */
.scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* ──────────────────────────────
   HOME / LOCATION SCREEN
────────────────────────────── */
#s-home{background:var(--white)}

.home-hero{
  flex:1;
  background:linear-gradient(180deg,#0F172A 0%,#1E3A5F 60%,#1D4ED8 100%);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* Decorative map grid lines */
.hero-grid{position:absolute;inset:0;pointer-events:none}
.hero-grid::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:40px 40px;
}
.hero-grid::after{
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;height:160px;
  background:linear-gradient(transparent,rgba(29,78,216,.8));
}

/* Hero road lines */
.road{position:absolute;background:rgba(255,255,255,.08)}
.road.h{height:2px;left:0;right:0}
.road.v{width:2px;top:0;bottom:0}
.road.hwy{height:6px;background:rgba(251,191,36,.25);left:0;right:0;top:42%;transform:rotate(-3deg)}

/* Blocks */
.blk{position:absolute;border-radius:4px;background:rgba(255,255,255,.06)}

/* Location pin */
.pin-wrap{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  z-index:5;
}
.pin-pulse{
  width:64px;height:64px;border-radius:50%;
  background:rgba(37,99,235,.3);
  position:absolute;
  top:50%;left:50%;transform:translate(-50%,-50%);
  animation:ripple 2s ease-out infinite;
}
.pin-dot{
  width:22px;height:22px;border-radius:50%;
  background:var(--brand);
  border:3px solid white;
  box-shadow:0 4px 12px rgba(37,99,235,.5);
  position:relative;z-index:2;
}
@keyframes ripple{
  0%{transform:translate(-50%,-50%) scale(.5);opacity:1}
  100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}
}

/* Hero top bar */
.hero-top{
  padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:10;
  flex-shrink:0;
}
.brnno-logo{
  font-size:22px;font-weight:800;color:white;
  letter-spacing:-1px;
}
.hero-top-right{display:flex;gap:8px;align-items:center}
.auth-link{
  font-size:13px;font-weight:500;color:rgba(255,255,255,.8);
  background:rgba(255,255,255,.12);
  padding:6px 14px;border-radius:99px;
  border:none;cursor:pointer;font-family:var(--f);
  backdrop-filter:blur(8px);
  transition:background .15s;
}
.auth-link:hover{background:rgba(255,255,255,.2)}

/* Bottom card */
.home-card{
  background:var(--white);
  border-radius:24px 24px 0 0;
  padding:24px 20px 20px;
  position:relative;z-index:10;
  flex-shrink:0;
  box-shadow:0 -4px 20px rgba(0,0,0,.12);
}
.home-card-handle{
  width:40px;height:4px;border-radius:2px;
  background:var(--line);margin:0 auto 20px;
}
.where-lbl{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}

/* Address input */
.addr-field{
  display:flex;align-items:center;gap:10px;
  background:var(--bg);
  border:1.5px solid var(--line);
  border-radius:var(--rs);
  padding:12px 14px;
  cursor:text;
  transition:border .15s;
  position:relative;
  margin-bottom:12px;
}
.addr-field:focus-within{border-color:var(--brand);background:var(--white)}
.addr-field-icon{
  width:28px;height:28px;border-radius:50%;
  background:var(--brand);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.addr-input-real{
  flex:1;border:none;background:none;
  font-size:14px;font-family:var(--f);color:var(--ink);
  outline:none;
}
.addr-input-real::placeholder{color:var(--ink3)}
.addr-clear{
  background:none;border:none;cursor:pointer;
  color:var(--ink3);font-size:18px;padding:2px;
  display:none;
}

/* Address suggestions */
.addr-suggestions{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--rs);
  overflow:hidden;
  margin-bottom:12px;
  display:none;
  box-shadow:var(--shadow-lg);
}
.addr-sugg-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  cursor:pointer;
  border-bottom:1px solid var(--bg);
  transition:background .1s;
}
.addr-sugg-item:last-child{border:none}
.addr-sugg-item:hover{background:var(--bg)}
.addr-sugg-icon{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:14px;
}
.addr-sugg-main{font-size:13px;font-weight:500}
.addr-sugg-sub{font-size:11px;color:var(--ink3);margin-top:1px}

/* Saved places */
.saved-row{display:flex;gap:10px;margin-bottom:16px}
.saved-chip{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--bg);border:1px solid var(--line);
  border-radius:var(--rxs);padding:10px 12px;
  cursor:pointer;transition:all .15s;
}
.saved-chip:hover{background:var(--brand-l);border-color:var(--brand-mid)}
.saved-chip-ico{font-size:16px}
.saved-chip-lbl{font-size:12px;font-weight:600;color:var(--ink2)}
.saved-chip-addr{font-size:11px;color:var(--ink3);margin-top:1px}

/* Book button */
.btn-book{
  width:100%;padding:16px;
  background:var(--brand);color:white;
  border:none;border-radius:var(--r);
  font-size:16px;font-weight:700;font-family:var(--f);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .15s;
  letter-spacing:-.2px;
}
.btn-book:hover:not(:disabled){background:var(--brand-d);transform:translateY(-1px);box-shadow:0 8px 20px rgba(37,99,235,.3)}
.btn-book:disabled{background:#CBD5E1;color:#94A3B8;cursor:not-allowed;transform:none;box-shadow:none}

/* Selected address bar */
.sel-addr-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--brand-l);
  border:1.5px solid var(--brand-mid);
  border-radius:var(--rs);
  padding:11px 14px;
  margin-bottom:12px;
}
.sel-addr-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0}
.sel-addr-text{font-size:13px;font-weight:500;flex:1;color:var(--brand-d)}
.sel-addr-change{font-size:12px;color:var(--brand);font-weight:600;background:none;border:none;cursor:pointer;font-family:var(--f);flex-shrink:0}

/* ──────────────────────────────
   BOOKING FLOW
────────────────────────────── */
#s-book{background:var(--white)}
.book-hdr{
  display:flex;align-items:center;gap:12px;
  padding:14px 20px 12px;
  border-bottom:1px solid var(--bg);
  flex-shrink:0;
}
.back-btn{
  background:var(--bg);border:none;
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink);font-size:18px;
  flex-shrink:0;transition:background .1s;
}
.back-btn:hover{background:var(--line)}
.progress-bar-wrap{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--brand);border-radius:2px;transition:width .3s ease}
.step-counter{font-size:12px;color:var(--ink3);font-weight:500;flex-shrink:0}

.book-body{
  flex:1;overflow-y:auto;
  padding:24px 20px;
  display:flex;flex-direction:column;gap:0;
}
.book-body::-webkit-scrollbar{display:none}

.step-eyebrow{font-size:11px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.step-h{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.5px;margin-bottom:4px}
.step-sub{font-size:14px;color:var(--ink3);margin-bottom:24px}
.sec-ttl{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;margin-top:20px}

/* Option cards */
.opt-card{
  border:2px solid var(--line);border-radius:var(--r);
  padding:16px;cursor:pointer;
  transition:all .15s;margin-bottom:10px;
  background:var(--white);
  position:relative;
}
.opt-card:hover{border-color:var(--brand-mid);background:var(--brand-l)}
.opt-card.sel{border-color:var(--brand);background:var(--brand-l)}
.opt-card.sel .opt-card-title{color:var(--brand-d)}
.opt-badge{
  position:absolute;top:-1px;right:16px;
  background:var(--brand);color:white;
  font-size:10px;font-weight:700;
  padding:3px 10px;border-radius:0 0 8px 8px;
  letter-spacing:.3px;
}
.opt-card-header{display:flex;align-items:flex-start;justify-content:space-between}
.opt-card-title{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.opt-price{font-size:18px;font-weight:800;color:var(--brand);letter-spacing:-.5px}
.opt-price span{font-size:12px;font-weight:500;color:var(--ink3)}
.opt-card-sub{font-size:13px;color:var(--ink3);margin-top:4px}
.opt-card-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.opt-tag{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--bg);border:1px solid var(--line);
  border-radius:99px;font-size:11px;padding:3px 9px;color:var(--ink2);font-weight:500;
}

/* Check mark for selected */
.opt-check{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.opt-card.sel .opt-check{background:var(--brand);border-color:var(--brand)}

/* Condition picker */
.cond-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.cond-btn{
  padding:14px 8px;border-radius:var(--rs);
  border:2px solid var(--line);background:var(--white);
  cursor:pointer;text-align:center;transition:all .15s;font-family:var(--f);
}
.cond-btn:hover{border-color:var(--brand-mid);background:var(--brand-l)}
.cond-btn.sel{border-color:var(--brand);background:var(--brand-l)}
.cond-emoji{font-size:22px;display:block;margin-bottom:6px}
.cond-name{font-size:12px;font-weight:700;color:var(--ink)}
.cond-note{font-size:10px;color:var(--ink3);margin-top:2px}
.cond-upcharge{font-size:11px;font-weight:700;color:var(--brand);margin-top:4px}

/* Photo drop zone */
.photo-zone{
  border:2px dashed var(--line);border-radius:var(--r);
  padding:28px 20px;text-align:center;cursor:pointer;
  transition:all .15s;margin-bottom:12px;
  background:var(--bg);
}
.photo-zone:hover{border-color:var(--brand-mid);background:var(--brand-l)}
.photo-zone-ico{font-size:32px;margin-bottom:10px}
.photo-zone-ttl{font-size:14px;font-weight:700;color:var(--ink)}
.photo-zone-sub{font-size:12px;color:var(--ink3);margin-top:4px}

/* AI result */
.ai-result{
  background:linear-gradient(135deg,#0F172A,#1E3A5F);
  border-radius:var(--r);padding:16px;margin-bottom:12px;
  display:flex;align-items:center;gap:14px;
}
.ai-result-ico{
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.ai-result-ttl{font-size:13px;font-weight:700;color:white}
.ai-result-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.ai-result-price{font-size:18px;font-weight:800;color:white;margin-left:auto;flex-shrink:0}

/* Detailer cards */
.det-card{
  display:flex;align-items:center;gap:14px;
  border:2px solid var(--line);border-radius:var(--r);
  padding:16px;cursor:pointer;margin-bottom:10px;
  transition:all .15s;background:var(--white);
}
.det-card:hover{border-color:var(--brand-mid);background:var(--brand-l)}
.det-card.sel{border-color:var(--brand);background:var(--brand-l)}
.det-av{
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,#DBEAFE,#93C5FD);
  color:var(--brand-d);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;flex-shrink:0;
  letter-spacing:-.5px;
}
.det-name{font-size:15px;font-weight:700;letter-spacing:-.2px}
.det-meta{font-size:12px;color:var(--ink3);margin-top:2px}
.det-stars{color:#F59E0B;font-size:12px}
.det-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.det-badge{
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;
  background:var(--bg);border:1px solid var(--line);color:var(--ink2);
}
.det-badge.green{background:var(--green-l);border-color:#A7F3D0;color:var(--green)}
.det-eta{
  margin-left:auto;text-align:right;flex-shrink:0;
}
.det-eta-n{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.det-eta-l{font-size:10px;color:var(--ink3)}

/* Date/time */
.date-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.date-row::-webkit-scrollbar{display:none}
.date-chip{
  flex-shrink:0;min-width:64px;
  padding:10px 14px;border-radius:var(--rs);
  border:2px solid var(--line);background:var(--white);
  cursor:pointer;text-align:center;transition:all .15s;
}
.date-chip:hover{border-color:var(--brand-mid)}
.date-chip.sel{background:var(--brand);border-color:var(--brand)}
.date-chip.sel .dc-d,.date-chip.sel .dc-n{color:white}
.dc-d{font-size:10px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.dc-n{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.time-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.time-btn{
  padding:12px 6px;border-radius:var(--rxs);
  border:2px solid var(--line);background:var(--white);
  font-size:13px;font-weight:600;font-family:var(--f);
  cursor:pointer;text-align:center;transition:all .15s;
  color:var(--ink);
}
.time-btn:hover{border-color:var(--brand-mid);background:var(--brand-l)}
.time-btn.sel{background:var(--brand);border-color:var(--brand);color:white}

/* Add-ons */
.addon-card{
  display:flex;align-items:center;gap:12px;
  border:2px solid var(--line);border-radius:var(--rs);
  padding:14px;cursor:pointer;margin-bottom:8px;
  transition:all .15s;background:var(--white);
}
.addon-card:hover{border-color:var(--brand-mid)}
.addon-card.sel{border-color:var(--brand);background:var(--brand-l)}
.addon-chk{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.addon-card.sel .addon-chk{background:var(--brand);border-color:var(--brand)}
.addon-name{font-size:13px;font-weight:700;flex:1}
.addon-desc{font-size:11px;color:var(--ink3);margin-top:1px}
.addon-pr{font-size:14px;font-weight:800;color:var(--brand);flex-shrink:0}

/* Order summary */
.order-card{
  background:var(--bg);border-radius:var(--r);
  padding:16px;border:1px solid var(--line);
  margin-bottom:16px;
}
.order-row{
  display:flex;justify-content:space-between;
  font-size:13px;padding:7px 0;
  border-bottom:1px solid var(--line);
}
.order-row:last-child{border:none;font-weight:700;font-size:16px;padding-top:12px}
.order-key{color:var(--ink3)}
.order-val{font-weight:500;text-align:right;max-width:200px;font-size:12px}
.pay-row{
  display:flex;align-items:center;gap:12px;
  background:var(--white);border:1.5px solid var(--line);
  border-radius:var(--rs);padding:12px 14px;margin-bottom:16px;
}
.pay-card-ico{
  width:36px;height:24px;background:#1A1F71;
  border-radius:4px;flex-shrink:0;
}

/* Confirmation */
.confirm-banner{
  background:linear-gradient(135deg,#1D4ED8,#2563EB,#3B82F6);
  border-radius:20px;padding:28px 24px;
  text-align:center;color:white;margin-bottom:20px;
}
.confirm-check{
  width:60px;height:60px;border-radius:50%;
  background:rgba(255,255,255,.2);
  margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
}
.confirm-ttl{font-size:22px;font-weight:800;letter-spacing:-.5px}
.confirm-sub{font-size:14px;opacity:.8;margin-top:4px}
.confirm-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.confirm-chip{
  background:rgba(255,255,255,.15);border-radius:99px;
  padding:5px 14px;font-size:12px;font-weight:600;
  backdrop-filter:blur(4px);
}
.upsell-box{
  background:var(--amber-l);border-radius:var(--r);
  border:1.5px solid #FCD34D;padding:16px;margin-bottom:16px;
}
.upsell-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.upsell-ico{font-size:18px}
.upsell-ttl{font-size:13px;font-weight:700;color:var(--ink)}
.upsell-sub{font-size:12px;color:var(--ink2);line-height:1.5;margin-bottom:12px}
.upsell-btns{display:flex;gap:8px}
.btn-ups-y{
  flex:1;padding:10px;background:var(--amber);color:white;
  border:none;border-radius:var(--rxs);
  font-size:13px;font-weight:700;font-family:var(--f);cursor:pointer;
}
.btn-ups-n{
  flex:1;padding:10px;background:none;
  border:1.5px solid var(--line);border-radius:var(--rxs);
  font-size:13px;color:var(--ink3);font-family:var(--f);cursor:pointer;
}

/* Bottom CTA */
.book-footer{
  padding:16px 20px;
  border-top:1px solid var(--bg);
  flex-shrink:0;background:var(--white);
}
.btn-next{
  width:100%;padding:16px;
  background:var(--brand);color:white;
  border:none;border-radius:var(--r);
  font-size:16px;font-weight:700;font-family:var(--f);
  cursor:pointer;transition:all .15s;letter-spacing:-.2px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-next:hover:not(:disabled){background:var(--brand-d)}
.btn-next:disabled{background:#CBD5E1;color:#94A3B8;cursor:not-allowed}
.btn-secondary{
  width:100%;padding:12px;margin-top:8px;
  background:none;border:1.5px solid var(--line);
  border-radius:var(--r);font-size:14px;color:var(--ink3);
  font-family:var(--f);cursor:pointer;transition:all .15s;
}
.btn-secondary:hover{background:var(--bg)}

/* ──────────────────────────────
   DASHBOARD
────────────────────────────── */
#s-dash{background:var(--white)}
.dash-hdr{
  padding:16px 20px 0;
  flex-shrink:0;
}
.dash-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.dash-logo{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-1px}
.dash-av{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand-l),var(--brand-mid));
  color:var(--brand-d);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;
}
.tab-bar{
  display:flex;border-top:1px solid var(--line);
  flex-shrink:0;background:var(--white);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.tab{
  flex:1;padding:10px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;border:none;background:none;
  color:var(--ink3);font-size:9px;font-weight:600;
  font-family:var(--f);transition:color .15s;
  letter-spacing:.2px;text-transform:uppercase;
}
.tab.on{color:var(--brand)}
.dash-content{flex:1;overflow-y:auto;padding:16px 20px}
.dash-content::-webkit-scrollbar{display:none}

/* Track tab */
.track-map{
  background:linear-gradient(160deg,#0F172A,#1E3A5F);
  border-radius:20px;height:200px;
  position:relative;overflow:hidden;margin-bottom:16px;
}
.track-map-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:30px 30px;
}
.track-road{position:absolute;background:rgba(255,255,255,.1)}
.track-eta{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:white;border-radius:99px;
  padding:6px 16px;font-size:12px;font-weight:700;
  white-space:nowrap;box-shadow:var(--shadow-lg);z-index:5;
  color:var(--ink);
}
.map-car{
  position:absolute;width:12px;height:12px;border-radius:50%;
  background:var(--brand);border:2.5px solid white;
  box-shadow:0 0 0 4px rgba(37,99,235,.3);
  animation:carPulse 2s ease-out infinite;
}
@keyframes carPulse{
  0%,100%{box-shadow:0 0 0 4px rgba(37,99,235,.3)}
  50%{box-shadow:0 0 0 8px rgba(37,99,235,.1)}
}
.map-dest{
  position:absolute;width:10px;height:10px;border-radius:50%;
  background:#F59E0B;border:2.5px solid white;
}
.map-route{position:absolute;stroke:var(--brand);stroke-width:2.5;fill:none;stroke-dasharray:6 3;opacity:.7}
.detailer-card{
  background:var(--white);border:1.5px solid var(--line);
  border-radius:var(--r);padding:16px;
  display:flex;align-items:center;gap:14px;
  margin-bottom:12px;
}
.status-indicator{
  width:8px;height:8px;border-radius:50%;
  background:var(--green);margin-left:auto;flex-shrink:0;
  box-shadow:0 0 0 3px var(--green-l);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.info-strip{
  background:var(--bg);border-radius:var(--rxs);
  padding:10px 14px;font-size:13px;color:var(--ink2);
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.unlock-btn{
  width:100%;padding:14px;
  background:var(--ink);color:white;
  border:none;border-radius:var(--r);
  font-size:14px;font-weight:700;font-family:var(--f);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s;margin-top:6px;
}
.unlock-btn:hover{background:#333}

/* Progress tab */
.prog-hero{
  background:var(--bg);border-radius:20px;
  padding:20px;margin-bottom:16px;
}
.prog-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.prog-pct{font-size:36px;font-weight:800;color:var(--brand);letter-spacing:-2px}
.prog-name{font-size:14px;font-weight:600;color:var(--ink);margin-top:2px}
.prog-eta{font-size:12px;color:var(--ink3)}
.prog-bar-bg{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--brand),#60A5FA);border-radius:4px;transition:width .5s}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.phase{
  padding:8px 4px;border-radius:var(--rxs);
  border:1.5px solid var(--line);
  text-align:center;font-size:9px;font-weight:700;
  color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;
  transition:all .3s;background:var(--white);
}
.phase.done{background:var(--brand-l);border-color:var(--brand-mid);color:var(--brand)}
.phase.active{background:var(--brand);border-color:var(--brand);color:white}
.breakdown-card{background:var(--white);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.bk-row{display:flex;justify-content:space-between;font-size:13px;padding:10px 16px;border-bottom:1px solid var(--bg)}
.bk-row:last-child{border:none}
.bk-key{color:var(--ink3)}
.eta-strip{background:var(--brand-l);border-radius:var(--rxs);padding:12px 16px;font-size:13px;font-weight:600;color:var(--brand-d);text-align:center}

/* Chat tab */
.chat-messages{
  display:flex;flex-direction:column;gap:10px;
  padding-bottom:8px;
}
.msg{max-width:80%}
.msg.them{align-self:flex-start}
.msg.me{align-self:flex-end}
.msg-name{font-size:10px;color:var(--ink3);font-weight:600;margin-bottom:3px;padding-left:2px}
.msg-bubble{
  padding:10px 14px;border-radius:14px;
  font-size:14px;line-height:1.5;
}
.msg.them .msg-bubble{background:var(--bg);border-radius:4px 14px 14px 14px;color:var(--ink)}
.msg.me .msg-bubble{background:var(--brand);color:white;border-radius:14px 4px 14px 14px}
.msg-time{font-size:10px;color:var(--ink3);margin-top:4px;padding:0 2px}
.msg.me .msg-time{text-align:right}
.chat-inp-row{
  display:flex;gap:8px;align-items:center;
  padding:12px 20px 16px;border-top:1px solid var(--bg);
  flex-shrink:0;background:var(--white);
}
.chat-inp{
  flex:1;padding:10px 14px;border-radius:99px;
  border:1.5px solid var(--line);background:var(--bg);
  font-size:14px;font-family:var(--f);outline:none;
  transition:all .15s;
}
.chat-inp:focus{border-color:var(--brand);background:var(--white)}
.chat-send{
  width:38px;height:38px;border-radius:50%;
  background:var(--brand);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s;
}
.chat-send:hover{background:var(--brand-d)}

/* Garage tab */
.car-big{
  display:flex;align-items:center;gap:14px;
  border:2px solid var(--line);border-radius:20px;
  padding:18px;cursor:pointer;margin-bottom:12px;
  transition:all .15s;background:var(--white);
}
.car-big:hover{border-color:var(--brand-mid);background:var(--brand-l)}
.car-illo{
  width:72px;height:50px;flex-shrink:0;
  background:var(--bg);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.car-bigname{font-size:16px;font-weight:800;letter-spacing:-.3px}
.car-bigmeta{font-size:12px;color:var(--ink3);margin-top:3px}
.car-last{font-size:11px;color:var(--ink2);margin-top:5px;font-weight:500}
.primary-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--green-l);color:var(--green);
  font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:99px;margin-top:5px;
}
.add-car{
  display:flex;align-items:center;gap:14px;
  border:2px dashed var(--line);border-radius:20px;
  padding:18px;cursor:pointer;margin-bottom:20px;
  color:var(--ink3);font-size:14px;font-weight:600;
  transition:all .15s;
}
.add-car:hover{border-color:var(--brand-mid);color:var(--brand)}
.hist-ttl{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.hist-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid var(--bg);font-size:13px;
}
.hist-item:last-child{border:none}
.hist-svc{font-weight:700}
.hist-who{font-size:11px;color:var(--ink3);margin-top:2px}
.hist-pr{font-size:14px;font-weight:800;color:var(--brand)}
.hist-date{font-size:11px;color:var(--ink3);text-align:right;margin-top:2px}

/* Car detail sub-screen */
.car-hero{
  background:linear-gradient(160deg,#0F172A,#1D4ED8);
  padding:20px 20px 28px;color:white;position:relative;flex-shrink:0;
}
.car-hero-back{
  position:absolute;top:16px;left:16px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.15);
  border:none;color:white;cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.car-hero-ttl{font-size:22px;font-weight:800;letter-spacing:-.5px;text-align:center;margin-top:16px}
.car-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--bg)}
.car-stat{padding:14px 8px;text-align:center;border-right:1px solid var(--bg)}
.car-stat:last-child{border:none}
.car-stat-n{font-size:22px;font-weight:800;letter-spacing:-.5px}
.car-stat-l{font-size:10px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.health-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.health-lbl{font-size:12px;color:var(--ink3);width:120px;flex-shrink:0;font-weight:600}
.health-bar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.health-fill{height:100%;border-radius:4px;transition:width .6s}
.health-val{font-size:12px;font-weight:800;width:36px;text-align:right;flex-shrink:0}
.book-again{
  width:calc(100% - 40px);margin:16px 20px;
  padding:16px;background:var(--brand);color:white;
  border:none;border-radius:var(--r);
  font-size:16px;font-weight:700;font-family:var(--f);
  cursor:pointer;transition:background .15s;
}
.book-again:hover{background:var(--brand-d)}

/* Referral tab */
.ref-hero{
  background:linear-gradient(135deg,#0F172A,#2563EB);
  border-radius:20px;padding:24px 20px;
  text-align:center;margin-bottom:16px;color:white;
}
.ref-code{
  font-size:32px;font-weight:800;letter-spacing:6px;
  margin:12px 0 6px;
}
.ref-tag{font-size:13px;opacity:.8}
.ref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ref-stat{background:rgba(255,255,255,.1);border-radius:12px;padding:12px 6px;text-align:center;backdrop-filter:blur(4px)}
.ref-stat-n{font-size:24px;font-weight:800}
.ref-stat-l{font-size:10px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.btn-share{
  width:100%;padding:14px;background:var(--brand);color:white;
  border:none;border-radius:var(--r);
  font-size:15px;font-weight:700;font-family:var(--f);cursor:pointer;
  margin-bottom:16px;transition:background .15s;
}
.btn-share:hover{background:var(--brand-d)}
.how-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--bg)}
.how-item:last-child{border:none}
.how-n{
  width:26px;height:26px;border-radius:50%;
  background:var(--brand);color:white;
  font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}
.how-txt{font-size:13px;color:var(--ink2);line-height:1.55}

/* Auth screen */
#s-auth{background:linear-gradient(160deg,#EFF6FF,#F0F9FF,#F7F7F5)}
.auth-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px}
.auth-logo{font-size:42px;font-weight:800;color:var(--brand);letter-spacing:-2px;margin-bottom:6px}
.auth-tagline{font-size:15px;color:var(--ink3);margin-bottom:32px}
.auth-card{width:100%;max-width:380px;background:white;border-radius:24px;border:1px solid var(--line);padding:24px;box-shadow:var(--shadow-lg)}
.auth-tabs{display:flex;background:var(--bg);border-radius:var(--rxs);overflow:hidden;margin-bottom:18px}
.auth-tab{
  flex:1;padding:10px;border:none;background:none;
  font-size:14px;font-weight:600;font-family:var(--f);cursor:pointer;
  color:var(--ink3);transition:all .15s;border-radius:var(--rxs);
}
.auth-tab.on{background:white;color:var(--ink);box-shadow:var(--shadow)}
.auth-inp{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:var(--rxs);font-size:14px;font-family:var(--f);
  outline:none;margin-bottom:10px;transition:border .15s;color:var(--ink);
}
.auth-inp:focus{border-color:var(--brand)}
.auth-err{font-size:12px;color:var(--red);min-height:16px;margin-bottom:6px;text-align:center}
.btn-auth{
  width:100%;padding:14px;background:var(--brand);color:white;
  border:none;border-radius:var(--r);font-size:15px;font-weight:700;
  font-family:var(--f);cursor:pointer;margin-bottom:10px;
  transition:background .15s;
}
.btn-auth:hover{background:var(--brand-d)}
.auth-or{text-align:center;font-size:12px;color:var(--ink3);margin:10px 0;position:relative}
.auth-or::before,.auth-or::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--line)}
.auth-or::before{left:0}.auth-or::after{right:0}
.btn-auth-ghost{
  width:100%;padding:12px;background:none;border:1.5px solid var(--line);
  border-radius:var(--r);font-size:14px;color:var(--ink2);
  font-family:var(--f);cursor:pointer;font-weight:600;
  transition:all .15s;
}
.btn-auth-ghost:hover{background:var(--bg);border-color:var(--brand-mid)}

/* VIN screen */
.vin-tabs{display:flex;background:var(--bg);border-radius:var(--rxs);overflow:hidden;margin-bottom:16px}
.vin-tab{
  flex:1;padding:9px;border:none;background:none;
  font-size:13px;font-weight:600;font-family:var(--f);cursor:pointer;
  color:var(--ink3);transition:all .15s;
}
.vin-tab.on{background:white;color:var(--ink);box-shadow:var(--shadow)}
.vin-found{
  background:var(--green-l);border-radius:var(--rs);
  border:1.5px solid #A7F3D0;padding:14px;margin-bottom:12px;
}
.vin-found-ttl{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.vin-badge{
  font-size:10px;background:var(--green);color:white;
  padding:2px 8px;border-radius:99px;font-weight:700;
}
.vin-found-sub{font-size:12px;color:var(--ink3);margin-top:3px}
.make-list{background:var(--white);border:1.5px solid var(--line);border-radius:var(--rs);overflow:hidden;margin-top:4px}
.make-item{padding:11px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--bg);transition:background .1s}
.make-item:hover{background:var(--bg)}
.make-item:last-child{border:none}
.make-item.hi{color:var(--brand);font-weight:700}

/* Utils */
.divider{height:1px;background:var(--bg);margin:16px 0}
.info-box{background:var(--bg);border-radius:var(--rxs);padding:12px 14px;font-size:13px;color:var(--ink3);text-align:center;border:1px solid var(--line)}
.mode-badge{
  position:fixed;top:12px;right:12px;
  font-size:10px;font-weight:700;padding:4px 10px;border-radius:99px;z-index:9999;
  letter-spacing:.3px;
}
.mode-badge.live{background:var(--green-l);color:var(--green)}
.mode-badge.demo{background:var(--amber-l);color:var(--amber)}
.sec-wrap{padding:16px 20px;border-bottom:1px solid var(--bg)}
.fade{animation:fadeUp .2s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="s-home" class="screen on">
  <div class="home-hero">
    <div class="hero-grid"></div>
    <div class="road h" style="top:25%"></div>
    <div class="road h" style="top:52%"></div>
    <div class="road h" style="top:76%"></div>
    <div class="road v" style="left:22%"></div>
    <div class="road v" style="left:55%"></div>
    <div class="road v" style="left:78%"></div>
    <div class="road hwy"></div>
    <div class="blk" style="top:14%;left:6%;width:70px;height:44px"></div>
    <div class="blk" style="top:14%;left:32%;width:100px;height:36px"></div>
    <div class="blk" style="top:60%;left:60%;width:60px;height:48px"></div>
    <div class="blk" style="top:62%;left:8%;width:76px;height:34px"></div>
    <div class="blk" style="top:32%;left:80%;width:50px;height:60px"></div>
    <div class="pin-wrap" id="pin-wrap">
      <div class="pin-pulse"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="hero-top">
      <div class="brnno-logo">Brnno</div>
      <div class="hero-top-right">
        <button class="auth-link" onclick="goAuth()" id="hero-login-btn" style="display:none">Log in</button>
      </div>
    </div>
  </div>
  <div class="home-card">
    <div class="home-card-handle"></div>
    <div class="where-lbl">Where should we come?</div>

    <!-- address input (always visible) -->
    <div class="addr-field" id="addr-field">
      <div class="addr-field-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="white" stroke-width="2"/>
          <path d="M16.5 16.5L21 21" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <input type="text" id="addr-inp" class="addr-input-real" placeholder="Search address or use saved place…" autocomplete="off" oninput="handleAddr(this.value)" onfocus="showSugg()"/>
      <button class="addr-clear" id="addr-clear-btn" onclick="clearAddr()">×</button>
    </div>
    <div class="addr-suggestions" id="addr-sugg"></div>

    <!-- selected address bar (hidden until selected) -->
    <div class="sel-addr-bar" id="sel-addr-bar" style="display:none">
      <div class="sel-addr-dot"></div>
      <span class="sel-addr-text" id="sel-addr-text">—</span>
      <button class="sel-addr-change" onclick="clearAddr()">Change</button>
    </div>

    <!-- saved places -->
    <div id="saved-row" class="saved-row">
      <div class="saved-chip" onclick="pickAddr('2847 NE 45th St, Seattle WA 98105','home')">
        <div class="saved-chip-ico">🏠</div>
        <div>
          <div class="saved-chip-lbl">Home</div>
          <div class="saved-chip-addr">NE 45th St, Seattle</div>
        </div>
      </div>
      <div class="saved-chip" onclick="pickAddr('1420 5th Ave, Seattle WA 98101','work')">
        <div class="saved-chip-ico">💼</div>
        <div>
          <div class="saved-chip-lbl">Work</div>
          <div class="saved-chip-addr">5th Ave, Seattle</div>
        </div>
      </div>
    </div>

    <button class="btn-book" id="btn-book" onclick="startBooking()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>
      Book a detail
    </button>
  </div>
</div>

<!-- BOOKING SCREEN -->
<div id="s-book" class="screen">
  <div class="book-hdr">
    <button class="back-btn" onclick="bookBack()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog-fill"></div></div>
    <span class="step-counter" id="step-ctr">1 / 5</span>
  </div>
  <div class="book-body" id="book-body"></div>
  <div class="book-footer" id="book-footer"></div>
</div>

<!-- DASHBOARD SCREEN -->
<div id="s-dash" class="screen">
  <div class="dash-hdr">
    <div class="dash-top">
      <div class="dash-logo">Brnno</div>
      <div class="dash-av" id="dash-av">G</div>
    </div>
  </div>
  <div class="dash-content" id="dash-content"></div>
  <div class="tab-bar">
    <button class="tab on" id="tb-track" onclick="dashTab('track')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Track
    </button>
    <button class="tab" id="tb-progress" onclick="dashTab('progress')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Progress
    </button>
    <button class="tab" id="tb-chat" onclick="dashTab('chat')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

window.doVIN=async(val)=>{
  const r=document.getElementById('vin-res');
  if(val.length<17){r.innerHTML=val?`<div style="font-size:12px;color:var(--ink3);text-align:center">${17-val.length} more digits needed</div>`:'';return;}
  r.innerHTML='<div class="info-box">Looking up via NHTSA…</div>';
  try{
    const res=await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/decodevin/${val}?format=json`);
    const data=await res.json();
    const get=n=>data.Results?.find(f=>f.Variable===n)?.Value||null;
    const yr=get('Model Year'),mk=get('Make'),md=get('Model');
    if(!yr||!mk||mk==='null'){r.innerHTML='<div class="info-box">VIN not found — try plate or search</div>';return;}
    window._pv={vin:val,year:parseInt(yr),make:mk,model:md,body_type:get('Body Class'),color:null};
    r.innerHTML=`<div class="vin-found"><div class="vin-found-ttl">${yr} ${mk} ${md} <span class="vin-badge">Found ✓</span></div><div class="vin-found-sub">${get('Body Class')||'Vehicle'} · VIN confirmed via NHTSA</div></div>
    <button class="btn-next" style="margin-top:12px" onclick="confirmV()">Add this vehicle →</button>`;
  }catch{r.innerHTML='<div class="info-box">Lookup failed — check connection</div>';}
};
window.doPlate=()=>{
  const p=document.getElementById('plate-inp')?.value;
  const st=document.getElementById('st-sel')?.value;
  const r=document.getElementById('plate-res'); if(!r) return;
  if(p&&p.length>=4&&st){
    window._pv={make:'Toyota',model:'RAV4',year:2021,body_type:'SUV',color:null,vin:null};
    r.innerHTML=`<div class="vin-found" style="margin-top:10px"><div class="vin-found-ttl">2021 Toyota RAV4 <span class="vin-badge">Found ✓</span></div><div class="vin-found-sub">SUV · ${p.toUpperCase()} in ${st}</div></div>
    <button class="btn-next" style="margin-top:12px" onclick="confirmV()">Add this vehicle →</button>`;
  }
};
window.filterMakes=(val)=>{ const dd=document.getElementById('make-dd');if(!dd||!val){if(dd)dd.style.display='none';return;} const m=MAKES.filter(x=>x.toLowerCase().startsWith(val.toLowerCase())).slice(0,6); dd.innerHTML=m.map(x=>`<div class="make-item${x.toLowerCase()===val.toLowerCase()?' hi':''}" onclick="pickMake('${x}')">${x}</div>`).join(''); dd.style.display=m.length?'block':'none'; };
window.pickMake=(make)=>{ window._sMake=make; document.getElementById('make-inp').value=make; document.getElementById('make-dd').style.display='none'; document.getElementById('model-group').style.display='block'; document.getElementById('model-inp').focus(); };
window.filterModels=(val)=>{ const dd=document.getElementById('model-dd');if(!dd)return; const list=(MODELS[window._sMake]||[]).filter(x=>x.toLowerCase().startsWith(val.toLowerCase())); dd.innerHTML=list.map(x=>`<div class="make-item" onclick="pickModel('${x}')">${x}</div>`).join(''); dd.style.display=list.length?'block':'none'; };
window.pickModel=(model)=>{ const yr=document.getElementById('yr-sel')?.value; document.getElementById('model-inp').value=model; document.getElementById('model-dd').style.display='none'; window._pv={make:window._sMake,model,year:parseInt(yr),body_type:'Vehicle',color:null,vin:null}; document.getElementById('manual-res').innerHTML=`<div class="vin-found" style="margin-top:10px"><div class="vin-found-ttl">${yr} ${window._sMake} ${model}</div></div><button class="btn-next" style="margin-top:12px" onclick="confirmV()">Add this vehicle →</button>`; };
window.confirmV=async()=>{

function renderProgress(el){
  const svc=S.bk.service||{name:'Full Detail',duration_minutes:150,mins:150};
  const pct=window._progPct||38;
  const mins=svc.duration_minutes||svc.mins||150;
  const rem=Math.round((100-pct)/100*mins);
  const phases=['Exterior Wash','Decontam.','Interior','Polish'];
  const active=Math.min(Math.floor(pct/25),3);
  el.innerHTML=`<div class="prog-hero fade">
    <div class="prog-top">
      <div><div class="prog-pct" id="prog-pct">${Math.round(pct)}%</div><div class="prog-name">${svc.name}</div><div class="prog-eta">~<span id="prog-rem">${rem}</span> min remaining</div></div>
      <div style="text-align:right;font-size:12px;color:var(--ink3)"><div>Started</div><div style="font-weight:700;color:var(--ink);font-size:15px">10:18 AM</div></div>
    </div>
    <div class="prog-bar-bg"><div class="prog-bar" id="prog-bar" style="width:${pct}%"></div></div>
    <div class="phases">${phases.map((p,i)=>`<div class="phase${i<active?' done':i===active?' active':''}">${p}</div>`).join('')}</div>
  </div>
  <div class="breakdown-card fade">
    <div class="bk-row"><span class="bk-key">Exterior wash</span><span>~30 min</span></div>
    <div class="bk-row"><span class="bk-key">Decontamination</span><span>~20 min</span></div>
    <div class="bk-row"><span class="bk-key">Interior detail</span><span>~60 min</span></div>
    <div class="bk-row"><span class="bk-key">Final polish</span><span>~40 min</span></div>
  </div>
  <div class="eta-strip fade">Estimated completion: 12:30 PM</div>`;
}
function startProg(){
  if(!window._progPct) window._progPct=38;
  window._pi=setInterval(()=>{
    window._progPct=Math.min(window._progPct+.2,99);
    const b=document.getElementById('prog-bar');
    const p=document.getElementById('prog-pct');
    const r=document.getElementById('prog-rem');
    if(b) b.style.width=window._progPct+'%';
    if(p) p.textContent=Math.round(window._progPct)+'%';
    const svc=S.bk.service||{mins:150,duration_minutes:150};
    if(r) r.textContent=Math.round((100-window._progPct)/100*(svc.duration_minutes||svc.mins||150));
    const phases=document.querySelectorAll('.phase');
    const active=Math.min(Math.floor(window._progPct/25),3);
    phases.forEach((ph,i)=>{ph.className='phase'+(i<active?' done':i===active?' active':'');});
  },300);
}

function renderChat(el){
  if(!S.chatMsgs.length) S.chatMsgs=[
    {from:'them',name:'David',text:"Hi! I'm about 8 minutes away. Is the Accord in the driveway?",time:'10:02 AM'},
    {from:'me',text:"Yes, dark blue one. I'll leave it unlocked!",time:'10:03 AM'},
    {from:'them',name:'David',text:'Perfect, see you soon 👍',time:'10:03 AM'},
  ];
  el.innerHTML=`<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px" id="chat-msgs">
    ${S.chatMsgs.map(m=>`<div class="msg ${m.from}">
      ${m.from==='them'?`<div class="msg-name">${m.name}</div>`:''}
      <div class="msg-bubble">${m.text}</div>
      <div class="msg-time">${m.time}</div>
    </div>`).join('')}
  </div>
  <div class="chat-inp-row">
    <input type="text" id="chat-inp" class="chat-inp" placeholder="Message David…"/>
    <button class="chat-send" onclick="sendChat()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>`;
  setTimeout(()=>{ const c=document.getElementById('chat-msgs'); if(c) c.scrollTop=c.scrollHeight; },60);
  const inp=document.getElementById('chat-inp');
  if(inp) inp.addEventListener('keydown',e=>{ if(e.key==='Enter') sendChat(); });
}
window.sendChat=()=>{
  const inp=document.getElementById('chat-inp'); if(!inp||!inp.value.trim()) return;
  const now=new Date();
  const t=`${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} ${now.getHours()<12?'AM':'PM'}`;
  S.chatMsgs.push({from:'me',text:inp.value.trim(),time:t}); inp.value='';
  renderChat(document.getElementById('dash-content'));
  setTimeout(()=>{
    const replies=["On my way!","Just finishing up the exterior.","About 3 minutes out now.","Got it!"];
    S.chatMsgs.push({from:'them',name:'David',text:replies[Math.floor(Math.random()*replies.length)],time:t});
    renderChat(document.getElementById('dash-content'));
  },1500);
};

function renderGarage(el){

  </div>`).join('')}

  <div class="hist-item"><div><div class="hist-svc">Basic Wash</div><div class="hist-who">David M. · ★4.9</div></div><div style="text-align:right"><div class="hist-pr">$49</div><div class="hist-date">Jan 4</div></div></div>`;
}
window.addCarGarage=()=>{ S.bk.step=0; show('book'); renderStep(); setTimeout(addVehicle,100); };

    <button class="car-hero-back" onclick="backGarage()">←</button>

        <path d="M24 36 L40 10 L140 10 L156 36" fill="rgba(255,255,255,.2)" stroke="rgba(255,255,255,.3)" stroke-width="1.3" stroke-linejoin="round"/>

      ${v.is_primary?'<div class="confirm-chip" style="background:rgba(5,150,105,.3)">✓ Primary</div>':''}

  <div style="padding:20px">
    <div style="background:var(--brand-l);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:20px">

      <div><div style="font-size:14px;font-weight:700;color:var(--brand-d)">Full detail due in ~3 weeks</div><div style="font-size:12px;color:var(--brand);margin-top:2px">Based on 6-week avg · pollen season</div></div>
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px">Condition tracking</div>
    ${[{l:'Exterior',v:v.ext||88,c:'#059669'},{l:'Interior',v:v.int||72,c:'#D97706'},{l:'Paint',v:v.paint||55,c:'#DC2626'}].map(h=>`
    <div class="health-row">

    <div class="hist-item"><div><div class="hist-svc">Full Detail</div><div class="hist-who">David M. · Paint decon added</div></div><div style="text-align:right"><div class="hist-pr">$184</div><div class="hist-date">Today</div></div></div>

};
window.backGarage=()=>{ const el=document.getElementById('dash-content'); el.style.cssText=''; renderGarage(el); };
window.bookAgain=()=>{ const v=S.carDetail; S.bk={step:0,vehicle:v,service:S.tiers?.find(t=>t.id==='full')||null,dirt:null,upcharge:0,det:null,date:null,time:null,addons:[],total:0}; show('book'); renderStep(); };

window.shareRef=(code)=>{
  if(navigator.share) navigator.share({title:'Get $20 off Brnno',text:`Use ${code} for $20 off your first mobile detail!`,url:'https://brnnomarketplace.netlify.app'});
  else{ navigator.clipboard?.writeText(code); const b=document.querySelector('.btn-share'); if(b){b.textContent='Copied! ✓';setTimeout(()=>b.textContent='Share your code →',2000);} }
};

// ETA countdown
setInterval(()=>{
  if(!window._eta) window._eta=8;
  const en=document.getElementById('eta-num');
  const et=document.getElementById('track-eta');
  if(!en) return;
  if(window._eta>1){
    window._eta--;
    en.textContent=window._eta;
    if(et) et.textContent=`David M. is ${window._eta} min away`;
  } else {
    en.textContent='Here!';
    if(et) et.textContent='David M. has arrived';
  }
},30000);
</script>
