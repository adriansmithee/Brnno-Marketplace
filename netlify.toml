[build]
  command = "printf 'window.__APP_ENV__={SUPABASE_URL:\"%s\",SUPABASE_ANON_KEY:\"%s\"};\n' \"$SUPABASE_URL\" \"$SUPABASE_ANON_KEY\" > web/env.js"
  publish = "web"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"
